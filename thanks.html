  <!-- Google tag (gtag.js) — GA4 プロパティ bluemouse.blue / 所有:584@bluemouse.blue -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3GLCNC8RL4"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    // 本番ドメイン以外（localhost・GitHub Pages既定ドメイン・検証環境）からは計測しない。
    // 動作確認のたびにテスト送信が本番データへ混ざるのを防ぐ。
    // サブドメインも許可しているので、将来 www を使い始めても計測は止まらない
    if (!/(^|\.)bluemouse\.blue$/.test(location.hostname)) {
      window['ga-disable-G-3GLCNC8RL4'] = true;
    }
    // スタッフ端末の除外：一度 ?noga=1 付きでアクセスすると、その端末は以後カウントしない。
    // 事業所のIPフィルタだけでは、スタッフがスマホ回線で見た分が数字に混ざるため併用する。
    // 解除は ?noga=0。localStorageが使えない環境では素通りする（計測は通常どおり）
    try {
      var q = location.search;
      if (q.indexOf('noga=1') !== -1) localStorage.setItem('bm_noga', '1');
      if (q.indexOf('noga=0') !== -1) localStorage.removeItem('bm_noga');
      if (localStorage.getItem('bm_noga') === '1') window['ga-disable-G-3GLCNC8RL4'] = true;
    } catch (e) {}
    gtag('js', new Date());
    gtag('config', 'G-3GLCNC8RL4');

    // 広告の流入元を、ページ移動をまたいで保持する。
    // 広告は child.html に着地し、送信は contact.html で行われるため、
    // URLのパラメータだけでは送信時に失われてしまう。
    // 保存するのは広告の識別名のみ。個人情報は含まない。
    try {
      var bmq = new URLSearchParams(location.search);
      if (bmq.get('utm_source')) {
        sessionStorage.setItem('bm_utm', JSON.stringify({
          source: bmq.get('utm_source') || '',
          medium: bmq.get('utm_medium') || '',
          campaign: bmq.get('utm_campaign') || '',
          content: bmq.get('utm_content') || ''
        }));
      }
    } catch (e) {}

    // 電話クリックの計測。tel:リンクはサイト全体で31箇所あるため、個別のonclickではなく
    // documentへの委譲1つで受ける（リンクを追加しても改修が要らない）
    document.addEventListener('click', function (e) {
      var t = e.target;
      if (!t || typeof t.closest !== 'function') return;
      var a = t.closest('a[href^="tel:"]');
      if (!a || typeof gtag !== 'function') return;
      gtag('event', 'tel_click', {
        phone_number: a.getAttribute('href').replace('tel:', ''),
        page_location: location.href,
        page_title: document.title
      });
    });
  </script>

<!-- ===== Loading ===== -->
<style>
  .bm-loading, .bm-loading body { overflow: hidden; }
  /* 幕：三輪車のブルーマウスが、道の上でこいでいる（2026-11-13）。
     絵は /chara/sanrinsha_loader.png（8コマを縦に並べた1枚。元は「キャラ（ブル）/三輪車/動画」の透過WebP）。
     大きさと位置は黄金比（1 : 1.618）で決めている。数字を変えるときは下の3か所をそろえること */
  .bm-loader {
    position: fixed; inset: 0; z-index: 9999;
    background: #FFFEFB;
    transition: opacity .8s cubic-bezier(.22,1,.36,1), visibility .8s;
    /* 三輪車の幅＝画面の幅×0.382（黄金比の小さいほう）。
       パソコンでは、スマホの最大機種（430px幅）と同じ164pxで止める。
       横向きのスマホでは、三輪車の高さが画面の高さ×0.382を超えないよう、高さの側で止める */
    --bm-w: min(38.2vw, 164px, 28.4vh);
  }
  .bm-loader.is-done { opacity: 0; visibility: hidden; }
  /* 道（地面の線）を画面の上から61.8%＝黄金分割の高さに引き、三輪車をその上に乗せる */
  .bm-loader__inner {
    position: absolute; left: 50%; top: 61.8%;
    transform: translate(-50%, -100%);
    display: flex; flex-direction: column; align-items: center;
  }
  .bm-loader__mouse {
    width: var(--bm-w); height: calc(var(--bm-w) * 1.3439); /* 絵の縦横比 410:551 */
    overflow: hidden;
    opacity: 0; transform: translateX(calc(var(--bm-w) * .2));
    transition: opacity .6s ease-out, transform .7s cubic-bezier(.22,1,.36,1);
  }
  .bm-loader__mouse i {
    display: block; height: 800%;
    background: url(/chara/sanrinsha_loader.png) 0 0 / 100% 100% no-repeat;
  }
  /* 絵が届いたら、右から少しこいで来て止まる（三輪車は左向き＝左へ進む） */
  .bm-loader.is-in .bm-loader__mouse { opacity: 1; transform: none; }
  .bm-loader.is-in .bm-loader__mouse i { animation: bmRide 1s steps(8) infinite; }
  /* 幕が上がるときは、進む向き（左）へ少し進みながら幕と一緒に消える。
     大きく走り去らせると、薄くなった三輪車がヒーローの文字の上を横切って見えたのでやめた */
  .bm-loader.is-done .bm-loader__mouse {
    transform: translateX(calc(var(--bm-w) * -.2));
    transition: transform .8s cubic-bezier(.22,1,.36,1);
  }
  /* 道：太さは三輪車の輪郭線と同じ（元の絵764px幅で約7.5px）。長さは三輪車の幅×1.618 */
  .bm-loader__road {
    position: relative; overflow: hidden; border-radius: 99px;
    width: calc(var(--bm-w) * 1.618);
    height: max(1px, calc(var(--bm-w) * .0098));
    margin-top: calc(var(--bm-w) * -.0065); /* 車輪がいちばん下がったとき、ちょうど線に乗る */
    transform: scaleX(0);
    animation: bmRoadIn .9s cubic-bezier(.65,0,.35,1) .1s forwards;
  }
  /* 3色（イエロー→コーラル→ティール）を右へ流して、三輪車が左へ進んで見えるようにする。
     流れる速さは前輪の回る速さに合わせた（前輪の直径＝元の絵で約230px・1秒で1回転 → 1.7秒で1巡） */
  .bm-loader__road::after {
    content: ''; position: absolute; top: 0; bottom: 0; left: -100%; width: 200%;
    background: linear-gradient(90deg, #f5d24a 0%, #f2906c 12.5%, #5fc1c7 25%, #f2906c 37.5%, #f5d24a 50%, #f2906c 62.5%, #5fc1c7 75%, #f2906c 87.5%, #f5d24a 100%);
    animation: bmRoadFlow 1.7s linear infinite;
  }
  @keyframes bmRide { to { transform: translateY(-100%); } }
  @keyframes bmRoadIn { to { transform: scaleX(1); } }
  @keyframes bmRoadFlow { to { transform: translateX(50%); } }
  @media (prefers-reduced-motion: reduce) {
    .bm-loader__mouse i, .bm-loader__road, .bm-loader__road::after { animation: none; transform: none; }
  }
</style>
<div class="bm-loader" id="bmLoader" aria-hidden="true">
  <div class="bm-loader__inner">
    <div class="bm-loader__mouse"><i></i></div>
    <span class="bm-loader__road"></span>
  </div>
</div>
<script>
(function () {
  var el = document.getElementById('bmLoader');
  if (!el) return;
  var root = document.documentElement;
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  // サイト内リンクでの遷移・ブラウザの戻る/進むでは出さない。
  // 直接訪問・外部からの流入・リロードなど「読み込み」のときは初回に限らず毎回出す。
  var navType = '';
  try {
    var navEntry = performance.getEntriesByType && performance.getEntriesByType('navigation')[0];
    if (navEntry) navType = navEntry.type;
  } catch (e) {}
  var fromSameSite = false;
  try {
    fromSameSite = !!document.referrer && new URL(document.referrer).origin === location.origin;
  } catch (e) {}
  var isInternalNav = (fromSameSite && navType !== 'reload') || navType === 'back_forward';

  if (reduce || isInternalNav) {
    if (el.parentNode) el.parentNode.removeChild(el);
    return;
  }
  root.classList.add('bm-loading');

  var removed = false;
  function done() {
    if (removed) return;
    removed = true;
    el.classList.add('is-done');
    root.classList.remove('bm-loading');
    setTimeout(function () { if (el.parentNode) el.parentNode.removeChild(el); }, 900);
  }
  // ---- 幕を上げるタイミング（2026-11-13）----
  // 三輪車は1秒でペダルが1回転する。幕はその区切りでだけ上げ、こいでいる途中で切らない。
  // 最低2回転は見せる。最初の画面に見えている画像がそろわなくても、3回転で上げる。
  // （以前は「ページの全画像」を待っていた。トップは画像だけで約4.5MBあり、スマホでは毎回4.5秒の保険まで出ていた）
  var CYCLE = 1000, MIN = 2 * CYCLE, MAX = 3 * CYCLE;
  var shownAt = 0, ready = false, timer = 0;
  function schedule() {
    if (!shownAt || removed) return;
    var t = Date.now() - shownAt;
    var at = ready ? Math.max(MIN, Math.ceil(t / CYCLE) * CYCLE) : MAX;
    clearTimeout(timer);
    timer = setTimeout(done, Math.max(0, at - t));
  }
  // 三輪車の絵が届いてから登場させ、そこから数える（先に数え始めると、こぐ姿を見せないまま幕が上がる）
  var pic = new Image();
  pic.onload = function () {
    if (removed) return;
    el.classList.add('is-in');
    shownAt = Date.now();
    schedule();
  };
  pic.src = '/chara/sanrinsha_loader.png';
  // 最初の画面に見えている画像がそろったら ready。下のほうの写真までは待たない
  var firstView = null;
  function markReady() { if (ready) return; ready = true; schedule(); }
  function check() {
    if (!firstView) return;
    for (var i = 0; i < firstView.length; i++) { if (!firstView[i].complete) return; }
    markReady();
  }
  function collect() {
    var vh = window.innerHeight;
    firstView = [];
    for (var i = 0; i < document.images.length; i++) {
      var im = document.images[i], r = im.getBoundingClientRect();
      if (!r.width || r.top >= vh) continue;
      firstView.push(im);
      im.addEventListener('load', check);
      im.addEventListener('error', check);
    }
    check();
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', collect);
  else collect();
  window.addEventListener('load', markReady);
  setTimeout(done, 4500); // 三輪車の絵が届かない・何かが失敗しても、必ず幕を上げる保険
})();
</script>
